[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-manager"
version = "0.1.0"
description = "Schedule management system with MCP tools and CLI for LLM tool calling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "vistart", email = "i@vistart.me" }
]
dependencies = [
    "mcp[cli]>=2.0",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "rhosocial-activerecord>=1.0.0.dev0,<2.0.0",
    "rhosocial-activerecord-postgres>=1.0.0.dev0,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
dev = [
    "black",
    "isort",
    "mypy",
    "ruff",
]

[project.scripts]
schedule-manager = "schedule_manager.cli:main"
schedule-manager-setup-db = "schedule_manager.setup_db:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
